name: RCA on alert

# Closes the "from alert to answer" loop. HyperDX raises an alert, its webhook
# fires repository_dispatch [rca-alert], and this runs the investigation on the
# self-hosted runner — where Langfuse is plain localhost, so traces record
# without the Cloudflare Access tunnel.
#
# NOTE: HyperDX is deliberately NOT load-bearing (see docs/DESIGN.md). detect.sql
# on a schedule is the real alert source. This path exists so the loop is
# demonstrable end to end, and so an external alert CAN drive it.

on:
  repository_dispatch:
    types: [rca-alert]
  workflow_dispatch:

concurrency:
  group: rca-run
  cancel-in-progress: false

jobs:
  investigate:
    runs-on: [self-hosted, vpc]
    steps:
      - uses: actions/checkout@v4

      - name: Report what triggered this
        run: |
          echo "event: ${{ github.event_name }}"
          echo "payload: ${{ toJSON(github.event.client_payload) }}"

      # Credentials come from a file the runner owns, not from GitHub secrets.
      # The runner is ON the VPC, so it already has local access; this also
      # avoids needing repo-admin rights to set secrets, and matches the
      # ch-hacker convention ("the VPC runner owns .env ... no secret handled
      # by hand"). ~/rca/rca.env is mode 600 and carries CH_* (ClickHouse
      # Cloud), CH_DB, CH_CLIENT, DEEPSEEK_API_KEY and LANGFUSE_*.
      - name: Run the investigation
        run: |
          set -a; . "$HOME/rca/rca.env"; set +a
          python3 -m engine.run --out out/

      - name: Publish the bundle
        uses: actions/upload-artifact@v4
        with:
          name: rca-bundle-${{ github.run_number }}
          path: out/
